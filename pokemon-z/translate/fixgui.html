<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Z 번역 스튜디오</title>
<link rel=icon type=image/png href=favicon.png>
<style>
 /* 배포판 스튜디오(webapp/index.html)와 같은 판 — 갈라지면 그쪽을 정본으로 맞춘다 */
 :root{--bg:#16171b;--panel:#1e2026;--card:#23252c;--line:#32343d;--tx:#e6e7ea;--sub:#9a9ca6;
   --acc:#5b8def;--acc2:#3d68c4;--ok:#4cc38a;--warn:#e5a54b;--err:#e5644b;--es:#93b8f2;
   --gold:#e9b64a;--gold2:#c99427}
 *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#3a3d47 transparent}
 ::-webkit-scrollbar{width:9px;height:9px}
 ::-webkit-scrollbar-thumb{background:#3a3d47;border-radius:5px;border:2px solid var(--bg)}
 ::-webkit-scrollbar-track{background:transparent}
 body{font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
 header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
   display:flex;align-items:center;gap:10px;padding:10px 22px;flex-wrap:wrap}
 .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.3px;
   white-space:nowrap;cursor:pointer;user-select:none;padding:2px 6px;border-radius:8px}
 .logo:hover{background:var(--card)}
 .logo b{color:var(--gold)}
 .searchwrap{position:relative;flex:1;display:flex;gap:8px;min-width:300px;max-width:640px;margin:0 auto}
 input,select,textarea,button{font-family:inherit;font-size:13.5px;color:var(--tx);
   background:var(--card);border:1px solid var(--line);border-radius:8px}
 input[type=text]{flex:1;padding:9px 12px;min-width:0}
 #q{font-size:14px}
 input:focus,textarea:focus{outline:none;border-color:var(--acc)}
 button{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;cursor:pointer;
   transition:background .12s;white-space:nowrap}
 button svg{flex:none}
 button:hover{background:#2c2e37}
 button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
 button.primary:hover{background:var(--acc2)}
 button.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));border-color:var(--gold2);
   color:#231a05;font-weight:700}
 button.gold:hover{background:linear-gradient(180deg,#f2c35e,var(--gold))}
 button.ghost{background:transparent}
 button:disabled{opacity:.45;cursor:not-allowed}
 button:disabled:hover{background:var(--card)}
 button.gold:disabled:hover{background:linear-gradient(180deg,var(--gold),var(--gold2))}
 #dirty{display:none;font-size:12.5px;color:var(--warn);background:rgba(229,165,75,.12);
   border:1px solid rgba(229,165,75,.35);border-radius:20px;padding:4px 12px;white-space:nowrap}
 /* 드롭다운 패널 — 기본 select 대신 (스크롤바까지 우리 것) */
 .menu{position:absolute;z-index:30;min-width:220px;max-height:min(480px,70vh);overflow-y:auto;
   background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;
   box-shadow:0 10px 30px rgba(0,0,0,.5)}
 .menu[hidden]{display:none}
 .menu button{display:flex;width:100%;text-align:left;background:transparent;border:none;
   border-radius:7px;padding:8px 10px;gap:9px;align-items:center}
 .menu button:hover{background:var(--card)}
 .menu .mi-t{display:flex;flex-direction:column;gap:1px;min-width:0}
 .menu .mi-d{font-size:11.5px;color:var(--sub);white-space:normal}
 .menu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}
 .sugg{top:calc(100% + 6px);left:0;right:0;min-width:0}
 .sugg button b{color:var(--acc);font-weight:600}
 .sugg button.on{background:var(--card)}
 .sugg .hint{font-size:11.5px;color:var(--sub);padding:4px 10px 6px}
 main{max-width:1100px;margin:20px auto;padding:0 22px 80px}
 .meta{color:var(--sub);font-size:13px;margin:6px 2px 16px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
   padding:13px 16px;margin-bottom:12px}
 .card.saved{border-color:rgba(76,195,138,.5)}
 .chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--sub);
   background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:2px 8px;margin-right:6px}
 .chip.act{cursor:pointer;color:var(--tx)}
 .chip.act:hover{border-color:var(--acc);color:var(--acc)}
 .chip.here{border-color:var(--acc);color:var(--acc)}
 .cmd{display:inline-block;color:var(--sub);font-size:11.5px;margin-right:6px}
 .es{color:var(--es);font-size:13px;line-height:1.55;margin:8px 0 6px;white-space:pre-wrap}
 .nv{font-size:13px;line-height:1.55;margin:0 0 2px;white-space:pre-wrap}
 mark{background:rgba(91,141,239,.3);color:var(--tx);border-radius:3px;padding:0 2px}
 textarea{width:100%;min-height:48px;padding:8px 10px;line-height:1.6;resize:vertical;white-space:pre-wrap}
 .rowbar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
 .memoin{flex:1;min-width:160px;padding:7px 10px}
 input[type=checkbox]{width:15px;height:15px;accent-color:var(--acc);flex:none}
 .st{font-size:12.5px} .st.ok{color:var(--ok)} .st.warn{color:var(--err)}
 .empty{color:var(--sub);text-align:center;padding:60px 0 70px;font-size:14px}
 .notecard{border-left:3px solid var(--warn)}
 .prop{border:1px solid rgba(76,195,138,.5);background:rgba(76,195,138,.07);border-radius:8px;
   padding:8px 11px;margin-top:8px}
 .prop h4{margin:0 0 5px;font-size:11px;letter-spacing:.06em;color:var(--ok);font-weight:600}
 .prop .why{font-size:12px;color:var(--warn);margin-top:5px}
 .notecard.done{border-left-color:var(--ok);opacity:.55}
 #toast{position:fixed;right:22px;bottom:22px;z-index:40;background:var(--panel);border:1px solid var(--line);
   border-radius:10px;padding:11px 18px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.45);
   opacity:0;transition:opacity .2s;pointer-events:none}
 #toast.show{opacity:1}
 kbd{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--panel)}
 .more{width:100%;padding:11px;justify-content:center}
</style></head><body>
<header>
 <div class=logo onclick=goHome() title="홈으로">Z <b>번역 스튜디오</b></div>
 <div class=searchwrap>
  <input type=text id=q autocomplete=off spellcheck=false autofocus
    placeholder="문구 검색 — 분류:도구 맵:리엔소 화자:접객 상태:수정 태그도 돼요">
  <button class=primary onclick=search()>
   <svg width=14 height=14 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round><circle cx=7 cy=7 r="4.5"/><path d="M10.5 10.5 14 14"/></svg>검색</button>
  <button class=ghost id=browsebtn data-menubtn onclick="togglePanel('browse',this)" title="맵·화자·분류·파일별로 훑어봐요">
   <svg width=14 height=14 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round style="color:var(--es)"><path d="M2 3.5h12M2 8h12M2 12.5h12"/><circle cx=4 cy=3.5 r=1.3 fill=currentColor stroke="none"/><circle cx=8 cy=8 r=1.3 fill=currentColor stroke="none"/><circle cx=12 cy=12.5 r=1.3 fill=currentColor stroke="none"/></svg>찾아보기</button>
  <div id=sugg class="menu sugg" hidden></div>
 </div>
 <div id=browse class=menu hidden>
  <button onclick="pickBrowse('map')"><span class=mi-t>맵별<span class=mi-d>맵 하나의 대사를 통째로</span></span></button>
  <button onclick="pickBrowse('sprite')"><span class=mi-t>화자별<span class=mi-d>같은 그림을 쓰는 NPC의 대사</span></span></button>
  <button onclick="pickBrowse('group')"><span class=mi-t>분류별<span class=mi-d>간호사·점원 같은 무리</span></span></button>
  <button onclick="pickBrowse('file')"><span class=mi-t>파일별<span class=mi-d>정본 절(jsonl) 하나씩</span></span></button>
 </div>
 <span id=dirty></span>
 <button class=gold onclick=build() id=buildbtn>
  <svg width=14 height=14 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.7 stroke-linecap=round stroke-linejoin=round><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z" fill=currentColor fill-opacity=".3"/></svg><span id=buildlabel>빌드 → 게임 반영</span></button>
 <button class=ghost id=toolsbtn data-menubtn onclick="togglePanel('tools',this)">
  <svg width=14 height=14 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round stroke-linejoin=round style="color:var(--sub)"><path d="M10.8 2.2a3.4 3.4 0 0 0-4.4 4.2L2 10.8a1.6 1.6 0 0 0 2.3 2.3l4.3-4.4a3.4 3.4 0 0 0 4.2-4.4L10.5 6.5 8.6 6.4l-.1-1.9z"/></svg>도구
  <svg width=10 height=10 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round style="color:var(--sub)"><path d="m4 6 4 4 4-4"/></svg></button>
 <div id=tools class=menu hidden>
  <button onclick="closePanels();replUI()">
   <svg width=15 height=15 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round stroke-linejoin=round style="color:var(--acc)"><path d="M12.5 6H3l2.5-2.5M3.5 10H13l-2.5 2.5"/></svg>
   <span class=mi-t>바꾸기<span class=mi-d>한 문구를 여러 행에서 한꺼번에 — 행마다 확인하고 골라요</span></span></button>
  <button onclick="closePanels();refSearch()">
   <svg width=15 height=15 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round stroke-linejoin=round style="color:var(--gold)"><path d="M2.5 3.5h4a2 2 0 0 1 1.5.7 2 2 0 0 1 1.5-.7h4v9h-4a2 2 0 0 0-1.5.7 2 2 0 0 0-1.5-.7h-4zM8 4.2v9"/></svg>
   <span class=mi-t>참고<span class=mi-d>검색창의 말을 용어집·본가 이름·문장 코퍼스에서 찾아요</span></span></button>
  <hr>
  <button onclick="closePanels();props()">
   <svg width=15 height=15 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round stroke-linejoin=round style="color:var(--ok)"><path d="M2.5 8.5 6 12l7.5-8"/></svg>
   <span class=mi-t>제안<span class=mi-d>에이전트가 올린 문안을 한 줄씩 보고 그대로 저장하거나 건너뛰어요</span></span></button>
  <button onclick="closePanels();notes()">
   <svg width=15 height=15 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round stroke-linejoin=round style="color:var(--warn)"><path d="m11 2.5 2.5 2.5L6 12.5l-3.2.7.7-3.2z"/></svg>
   <span class=mi-t>메모<span class=mi-d>손볼 자리를 쌓아 두고 다시 찾아가요 · 문구에 매이지 않는 전반 지적도 여기</span></span></button>
  <button onclick="closePanels();histView()">
   <svg width=15 height=15 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round style="color:var(--es)"><circle cx=8 cy=8 r="5.8"/><path d="M8 4.8V8l2.3 1.6"/></svg>
   <span class=mi-t>이력<span class=mi-d>동작 묶음으로 보고 묶음째 되돌려요</span></span></button>
  <hr>
  <button onclick="closePanels();help()">
   <svg width=15 height=15 viewBox="0 0 16 16" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round stroke-linejoin=round style="color:var(--sub)"><circle cx=8 cy=8 r="5.8"/><path d="M6.2 6.2a1.8 1.8 0 1 1 2.4 1.7c-.4.2-.6.5-.6.9v.4"/><path d="M8 11.6h.01"/></svg>
   <span class=mi-t>도움말<span class=mi-d>저장·빌드가 하는 일, 태그 문법, 칩 읽는 법</span></span></button>
 </div>
</header>
<main>
 <div class=meta id=meta>검색어를 입력하세요. 저장 <kbd>Ctrl+Enter</kbd> · 검색 <kbd>Enter</kbd></div>
 <div id=out><div class=empty>어색한 문구를 발견하면 여기서 찾아 바로 고치세요.<br>
  확신이 없으면 메모로 남겨 두면 됩니다 — 나중에 한꺼번에 처리해요.</div></div>
</main>
<div id=toast></div>
<script>
const $=id=>document.getElementById(id);
let HITS=[],ALL=[],PEND=[],SHOWN=0,DIRTY=0,FILE='',QRY='',TRUNC=false;
let PROPS={props:[],groups:[],note:''};const STEP=50;
// ─ 검색 태그 자동완성 — 값 후보는 서버(/tagvals)가 낸다 ─
const TAGKEYS=['분류','맵','화자','원문','번역','상태'];
const TAG_RE=new RegExp('^('+TAGKEYS.join('|')+'):(.*)$');
const unq=s=>s.replace(/^"([^"]*)"?$/,'$1');
let SUGN=-1;
async function suggest(){
 const q=$('q'),upto=q.value.slice(0,q.selectionStart??q.value.length);
 const word=upto.split(/\s+/).pop(),m=word.match(TAG_RE);
 let items=[];
 if(m){
  const r=await fetch(`/tagvals?tag=${encodeURIComponent(m[1])}&part=${encodeURIComponent(unq(m[2]))}`);
  items=(await r.json()).vals.map(x=>({
   ins:`${m[1]}:${/\s/.test(x.v)?`"${x.v}"`:x.v} `,label:`<b>${m[1]}:</b>${esc(x.label)}`}));
 }else if(word){
  items=TAGKEYS.filter(t=>t.startsWith(word)).map(t=>({ins:`${t}:`,
   label:`<b>${t}:</b><span class=mi-d style="margin-left:6px">태그로 좁혀요</span>`}));
 }
 SUGN=-1;
 const sg=$('sugg');
 if(!items.length){sg.hidden=true;return}
 sg._items=items;
 sg.innerHTML=items.map((it,i)=>
  `<button class=si tabindex=-1 onmousedown="event.preventDefault();acceptSugg(${i})">${it.label}</button>`).join('')
  +'<div class=hint>Tab·클릭으로 채우고 Enter로 검색해요</div>';
 sg.hidden=false;
}
function acceptSugg(i){
 const it=$('sugg')._items?.[i]; if(!it)return;
 const q=$('q'),pos=q.selectionStart??q.value.length;
 const upto=q.value.slice(0,pos),word=upto.split(/\s+/).pop();
 q.value=upto.slice(0,upto.length-word.length)+it.ins+q.value.slice(pos);
 const at=upto.length-word.length+it.ins.length;
 q.setSelectionRange(at,at); q.focus(); suggest();
}
$('q').addEventListener('input',suggest);
$('q').addEventListener('focus',suggest);
$('q').addEventListener('keydown',e=>{
 const sg=$('sugg');
 if(!sg.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
  e.preventDefault(); const n=sg._items.length;
  SUGN=(SUGN+(e.key==='ArrowDown'?1:n-1)+n)%n;
  [...sg.querySelectorAll('.si')].forEach((b,i)=>b.classList.toggle('on',i===SUGN));
  return;
 }
 if(!sg.hidden&&(e.key==='Tab'||(e.key==='Enter'&&SUGN>=0))){
  e.preventDefault(); acceptSugg(SUGN>=0?SUGN:0); return;
 }
 if(e.key==='Enter'){sg.hidden=true;search()}
});
function toast(m,ms=2200){const t=$('toast');t.textContent=m;t.classList.add('show');
 clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
// 속성값 자리에도 그대로 쓰므로 따옴표까지 막는다
function esc(s){const d=document.createElement('div');d.textContent=s??'';
 return d.innerHTML.replace(/"/g,'&quot;')}
function dirty(n){DIRTY+=n;const d=$('dirty');
 if(DIRTY>0){d.style.display='inline-block';d.textContent=`저장 ${DIRTY}건 — 빌드 필요`}
 else d.style.display='none'}
// 드롭다운 패널 — 열림/닫힘과 자리만 여기서, 내용은 마크업에 있다
const PANELS=['tools','browse','sugg'];
function closePanels(){for(const id of PANELS){const p=$(id);if(p)p.hidden=true}}
function togglePanel(id,btn){
 const p=$(id),wasOpen=!p.hidden;
 closePanels(); if(wasOpen)return;
 p.hidden=false;
 const hr=btn.closest('header').getBoundingClientRect(),br=btn.getBoundingClientRect();
 p.style.top=(br.bottom-hr.top+6)+'px'; p.style.left='auto'; p.style.right='auto';
 if(br.left-hr.left+p.offsetWidth>hr.width-12)p.style.right=Math.max(8,hr.right-br.right)+'px';
 else p.style.left=(br.left-hr.left)+'px';
}
addEventListener('click',e=>{if(!e.target.closest?.('.menu,[data-menubtn],#q'))closePanels()});
addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});
// 홈 — 빈 화면 대신 지금 상태를 세워 둔다(어디서 이어 할지가 여기서 보여야 한다)
async function goHome(){
 closePanels();$('q').value='';FILE='';ALL=[];HITS=[];QRY='';
 $('meta').innerHTML='검색어를 입력하세요 — 태그도 돼요(<b>분류:</b>도구 · <b>맵:</b>리엔소 · <b>화자:</b>접객 · '
  +'<b>원문:</b>Hola · <b>상태:</b>수정). 태그 이름을 치면 값 후보가 떠요. '
  +'저장 <kbd>Ctrl+Enter</kbd> · 검색 <kbd>Enter</kbd>';
 $('out').innerHTML='<div class=meta>불러오는 중...</div>';
 const [files,ops,notes]=await Promise.all([
  fetch('/browse?by=file').then(r=>r.json()),
  fetch('/history').then(r=>r.json()),
  fetch('/notes').then(r=>r.json())]);
 const total=files.groups.reduce((a,g)=>a+g.count,0);
 const pend=notes.notes.filter(n=>!n.done);
 const sec=(t,body,foot='')=>`<div class=card><b>${t}</b>${body}${foot}</div>`;
 $('out').innerHTML=
  sec(`정본 ${total.toLocaleString()}행`,
   `<div class=rowbar>${files.groups.map(g=>
     `<span class="chip act" onclick="openGroup('file','${esc(g.key)}')">${esc(g.key)} ${g.count}</span>`).join('')}</div>`)
  +sec(pend.length?`손볼 메모 ${pend.length}건`:'손볼 메모 없음',
   (PEND=pend).slice(0,5).map((n,i)=>`<div class=rowbar>
     ${n.query?`<span class="chip act" onclick="gotoNote(PEND[${i}].query)">찾아가기</span>`
       :'<span class=chip>전반</span>'}
     <span class=nv>${n.query?`「${esc(n.query)}」 — `:''}${esc(n.note)}</span></div>`).join('')
    ||'<div class=meta>어색한 자리를 만나면 카드의 [메모]로 쌓아 두세요.</div>',
   pend.length>5?`<div class=rowbar><button class=ghost onclick=notes()>메모 전부 보기</button></div>`:'')
  +sec('최근 고친 자리',
   ops.ops.slice(0,3).map(o=>`<div class=rowbar>
     <span class=chip>${KIND[o.kind]||o.kind}</span><span class=chip>${o.rows.length}행</span>
     <span class="chip act" onclick="openLine('${esc(o.rows[0].file)}',${o.rows[0].line})">${esc(o.rows[0].file)}:${o.rows[0].line}</span>
     <span class=nv>${esc(o.rows[0].new.slice(0,60))}</span></div>`).join('')
    ||'<div class=meta>아직 고친 자리가 없습니다.</div>',
   `<div class=rowbar><button class=ghost onclick=histView()>이력 전부 보기</button></div>`);
}
addEventListener('DOMContentLoaded',goHome);
// 도움말 — 이 도구가 무엇을 건드리는지 한 화면에. 자세한 규율은 저장소 지침이 정본
function help(){
 $('meta').textContent='도움말 — 이 도구가 무엇을 건드리나';
 const card=(t,body)=>`<div class=card><b>${t}</b>${body}</div>`;
 $('out').innerHTML=
  card('[저장]을 누르면',`
   <div class=nv>번역 정본 <b>translate/ko/</b>의 절 파일에서 <b>그 한 줄만</b> 새 값으로 바뀝니다.
    같은 순간 저장 이력(fixlog.jsonl)에 어느 파일 몇 번째 줄인지·옛 값·새 값이 남고,
    그것으로 [이력]의 되돌리기가 돌아요.</div>

   <div class=meta>특정 문구에 매이지 않는 지적을 남겨요 — 어떤 인물의 말투가 들쭉날쭉하다,
    어떤 화면이 깨져 보인다 같은 것. 카드에서 남기는 메모와 같은 곳에 쌓입니다.</div>
   <textarea id=gnote placeholder="예: 크리산토 대사가 전반적으로 과장돼 있어요 — 한 번 훑어야 할 듯"></textarea>
   <div class=rowbar><button class=primary onclick=addNote()>메모 남기기</button></div>
  </div>`
  +js.notes.map((n,i)=>`
  <div class="card notecard ${n.done?'done':''}">
   <span class=chip>${i+1}</span>${n.query?`「${esc(n.query)}」`:'<span class=chip>전반</span>'}
   <div class=es>${esc(n.note)}</div>
   <div class=rowbar>
    ${n.query?`<button onclick=gotoNote(${JSON.stringify(n.query).replace(/"/g,'&quot;')})>대상 찾아가기</button>`:''}
    <button onclick=doneNote(${i+1},${n.done?'false':'true'})>${n.done?'완료 취소':'완료 처리'}</button>
    <button class=ghost onclick=delNote(${i+1})>삭제</button>
   </div>
  </div>`).join('')||'<div class=empty>메모가 없습니다.</div>';
}
async function addNote(){
 const note=$('gnote').value.trim();
 if(!note){toast('적을 내용을 넣어 주세요');return}
 await fetch('/note',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({query:'',note})});
 toast('전반 메모에 쌓아 뒀어요'); notes();
}
function gotoNote(q){$('q').value=q;search()}
async function doneNote(i,done){
 await fetch('/done',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({i,done})});
 notes();
}
async function delNote(i){
 await fetch('/notedel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({i})});
 notes();
}
function showOrig(i){
 const el=$('orig'+i);const ta=$('v'+i);
 if(el.style.display==='none'){
  el.innerHTML='저장 전 원본: '+esc(ta.dataset.orig)+' &nbsp;<button class=ghost onclick="restoreOrig('+i+')">이 값으로 되돌리기</button>';
  el.style.display='block';
 }else el.style.display='none';
}
function restoreOrig(i){$('v'+i).value=$('v'+i).dataset.orig;toast('되돌렸어요 — 저장을 눌러야 반영됩니다')}
const KIND={row:'행 수정',bulk:'일괄 바꾸기',revert:'되돌리기'};
async function histView(){
 const r=await fetch('/history');const js=await r.json();
 $('meta').textContent=`이력 — 동작 ${js.ops.length}묶음`;
 $('out').innerHTML=js.ops.map(o=>`
  <div class=card>
   <span class=chip>${KIND[o.kind]||o.kind}</span><span class=chip>${o.rows.length}행</span>
   ${o.label?`<span class=chip>${esc(o.label)}</span>`:''}
   ${o.rows.slice(0,5).map(h=>`<div class=es>${esc(h.file)}:${h.line} · 구: ${esc(h.old)}<br>&nbsp;&nbsp;신: ${esc(h.new)}</div>`).join('')}
   ${o.rows.length>5?`<div class=chip>외 ${o.rows.length-5}행</div>`:''}
   <div class=rowbar><button onclick="revertOp('${esc(o.op)}')">이 묶음 되돌리기</button></div>
  </div>`).join('')||'<div class=empty>저장 이력이 없습니다.</div>';
}
async function revertOp(op){
 const r=await fetch('/revert',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({op})});
 const js=await r.json();
 dirty(js.done);
 toast(`${js.done}행 되돌림`+(js.skipped?` · ${js.skipped}행 건너뜀(뒤에 다시 고쳐진 자리)`:'')
   +(js.errs&&js.errs.length?` · 실패 ${js.errs.length}`:''),4000);
 histView();
}
let PLAN=[];
function replUI(){
 $('meta').textContent='일괄 바꾸기 — 미리보기로 대상을 확인하고 고른 자리만 적용합니다.';
 $('out').innerHTML=`<div class=card>
  <div class=rowbar><input type=text id=rfind placeholder="찾을 문구 (번역 칸) — 비우면 원문 기준">
   <input type=text id=rrepl placeholder="바꿀 문구"></div>
  <div class=rowbar><input type=text id=rsrc placeholder="원문(스페인어) 조건 — 선택">
   <input type=text id=rfile placeholder="파일 이름 — 선택 (예: 00-maps.jsonl)">
   <button class=primary onclick=replPlan()>미리보기</button></div>
  <div class=meta>찾을 문구를 비우고 원문 조건만 주면 그 원문을 가진 행의 번역을 통째로 갈아 끼웁니다.</div>
 </div><div id=plan></div>`;
}
async function replPlan(){
 const body={find:$('rfind').value,repl:$('rrepl').value,src:$('rsrc').value,file:$('rfile').value};
 $('plan').innerHTML='<div class=empty>찾는 중...</div>';
 const r=await fetch('/replan',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify(body)});
 const js=await r.json();
 if(!js.ok){$('plan').innerHTML=`<div class=empty>${esc(js.err)}</div>`;return}
 PLAN=js.hits;
 if(!PLAN.length){$('plan').innerHTML='<div class=empty>바뀔 행이 없습니다.</div>';return}
 $('plan').innerHTML=`<div class=card><b>${PLAN.length}행 바뀝니다</b>${PLAN.length>=500?' (상한 500)':''}
   <div class=rowbar><button class=primary onclick=replApply()>선택 적용</button>
    <button class=ghost onclick="planAll(true)">전체 선택</button>
    <button class=ghost onclick="planAll(false)">전체 해제</button></div></div>`
  +PLAN.map((h,i)=>`<div class=card id=pc${i}>
    <label class=rowbar><input type=checkbox id=pk${i} checked>
     <span class=chip>${esc(h.file)}:${h.line}</span></label>
    <div class=es>${esc(h.es)}</div>
    <div class=es>구: ${esc(h.v)}</div><div>신: ${esc(h.new)}</div>
   </div>`).join('')
  +(js.skipped.length?`<div class=card><b>원문 조건에 걸려 뺀 행 ${js.skipped.length}</b>`
    +js.skipped.map(h=>`<div class=es>${esc(h.file)}:${h.line} · ${esc(h.es)}<br>${esc(h.v)}</div>`).join('')
    +'</div>':'');
}
function planAll(on){PLAN.forEach((_,i)=>{const c=$('pk'+i);if(c)c.checked=on})}
async function replApply(){
 const items=PLAN.filter((_,i)=>$('pk'+i)&&$('pk'+i).checked);
 if(!items.length){toast('고른 자리가 없어요');return}
 const label=`「${$('rfind').value||'(원문 기준)'}」→「${$('rrepl').value}」`;
 const r=await fetch('/replace',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({items,label})});
 const js=await r.json();
 dirty(js.done);
 toast(`${js.done}행 반영`+(js.errs.length?` · 실패 ${js.errs.length}`:'')+' — 빌드하면 게임에 반영돼요',4000);
 histView();
}
async function refSearch(){
 const q=$('q').value.trim(); if(!q){toast('검색창에 찾을 용어를 입력하세요');return}
 $('meta').textContent='참고 자료 검색 중... (첫 실행은 코퍼스 로드로 수십 초)';
 const r=await fetch('/ref?q='+encodeURIComponent(q)); const js=await r.json();
 $('meta').textContent=`참고 — 「${q}」`;
 const sec=(t,rows)=>rows.length?`<div class=card><b>${t}</b>${rows}</div>`:'';
 $('out').innerHTML=
  sec('용어집 (glossary.md)', js.glossary.map(l=>`<div class=es>${esc(l)}</div>`).join(''))+
  sec('본가 정식명 (canon)', js.canon.map(c=>`<div class=es>${esc(c.es||'')} · ${esc(c.en||'')} → <b>${esc(c.ko||'')}</b> <span class=chip>${esc(c.domain||'')}</span></div>`).join(''))+
  sec('공식 문장 코퍼스 (참고용 — 자동 적용 금지)', js.messages.map(m=>`<div class=es>[${esc(m.src||'')}·${esc(m.file||'')}] ${esc(m.es||'')}<br>→ ${esc(m.ko||'')}</div>`).join(''))
  ||'<div class=empty>참고 자료에 매칭이 없습니다.</div>';
}
async function doBrowse(by){
 QRY=''; $('meta').textContent='불러오는 중...';
 const r=await fetch('/browse?by='+by); const js=await r.json();
 const names={map:'맵',sprite:'화자',group:'분류',file:'파일'};
 $('meta').textContent=`${names[by]}별 — ${js.groups.length}개 묶음`;
 $('out').innerHTML=js.groups.map(g=>`
  <div class=card style="cursor:pointer" onclick="openGroup('${by}','${esc(g.key)}')">
   <b>${esc(g.label)}</b> <span class=chip>${g.count}행</span>
  </div>`).join('');
}
async function openGroup(by,key){
 $('meta').textContent='불러오는 중...';
 const r=await fetch('/list?by='+by+'&key='+encodeURIComponent(key)); const js=await r.json();
 HITS=js.hits; SHOWN=0;
 $('meta').textContent=`${key} — ${js.hits.length}행`+(js.hits.length>=500?' (상한 500)':'');
 $('out').innerHTML=''; more();
}
</script></body></html>
