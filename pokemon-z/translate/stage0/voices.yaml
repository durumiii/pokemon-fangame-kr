# 말투 정본 — 화자별 프롬프트 지시와 본보기. **이 파일이 정본이다** (2026-08-18 강등:
# 옛 voice-prompts.jsonl을 대체). gen이 다시 쓰지 않으므로 직접 편집한다.
# 새 판정은 여기와 대장(docs/ledger/voices.md) 두 곳에 — 근거·이력은 대장에만.
# 지시의 조건 표기 [맵>=N]은 batch_pages.resolve_conditions가 푼다.
voices:
- group: 크리산토
  match:
    name: 크리산토
  instruction: 또래에게는 평범한 구어 반말, 문어투 어미는 이따금 얹는 정도. 하게체·하오체로는 가지 않는다. 시적 과장과 기사도 로망은 어휘(연대기·운명·명예)와 프랑스어 감탄(monsieur, mon dieu 원문 유지)에서 나온다. 기본은 존대이고 반말은 멜리아·주인공·알카·아우레에게만. 미라에게는 끝까지 경칭. [맵<147] 란토에게는 존대. [맵>=147] 란토에게는 반말.
  samples:
  - register: 하대
    text: 내가 한 번 시도해 볼게. 아직 내 포켓몬이 있으니까.
  - register: 하대
    text: 준비가 모두 끝나거든, 진영 반대편 배틀에 합류해 줘!
  - register: 하대
    text: 하... 두 사람 모두 정말 대단한 기량을 보여줬어!
  - register: 하대
    text: 오, 안 돼! 들키고 말았잖아!
  - register: —
    text: 꿈도 꾸지 마라! 너희를 상대할 확실한 무기가 있으니!
  - register: —
    text: 다른 누구도 내 죄로 인해 고통받게 둘 수는 없다.
  - register: 존대
    text: 부디 성의로 드리는 이 동전 몇 개를 받아 주십시오.
  - register: 존대
    text: 이봐요, 당신! 그 도끼는 좀 더 조심히 다루셔야죠!
  source: translate/voice-prompts.jsonl
- group: 멜리아
  match:
    name: 멜리아
  instruction: 주인공 일행·플라엣테에게 반말, **메를로 같은 어른에게 해요체**, **AZ에게는 친근한 반말**(아버지이므로 — 아빠라고 부르며 해요체로 올리지 않는다). 다만 최종병기 발사 뒤 대면 장면(맵501)에서는 거리를 두는 존대. 감정이 앞서는 생기, 짧은 감탄(「아이고!」).
  samples:
  - register: 하대
    text: 응, 쫓아내긴 했는데... 그 사람들은 정확히 누구야?
  - register: 존대
    text: 괜찮으세요, <i>무슈</i>? 무슨 일 있으셨나요?
  - register: —
    text: 휴, 네가 없었으면... 정말로 그렇게 됐을지도 몰라!
  - register: 하대
    text: 이야기할 시간이 생기면 내 이야기를 해주겠다고 했었지.
  - register: 존대
    text: 제 포켓몬으로 도와드릴게요, 조금만 참으세요!
  - register: —
    text: 우리가 엉뚱한 자들을 건드리지 않았더라면...
  - register: 하대
    text: 아이고... 순간 진짜 우리를 납치하려는 줄 알았어.
  - register: —
    text: 게다가 이 모습의 플라베베를 데리고 있는 귀족 가문이 우리뿐인 것도 아니고.
  source: translate/voice-prompts.jsonl
- group: 올리비에
  match:
    name: 올리비에
  instruction: 학생에게 시원시원한 반말, 공식 석상은 해요체. 재치·빈정 한 스푼. 란토에게는 원문 격을 따른다 — usted면 빈정 섞인 얼음 존대, tú로 위협하는 자리는 반말.
  samples:
  - register: 하대
    text: 그보다 다음 섭정에게 도전할 준비나 해야 하지 않겠어?
  - register: —
    text: 흠! 의문스러운 결정에 일일이 따지고 들 기분도 아니니.
  - register: 하대
    text: 다음 주나 되어야 운동 능력이 생길 줄 알았는데 말이지.
  - register: 존대
    text: 제 감정은 아주 잘 제어되고 있답니다, <i>무슈</i>.
  - register: 하대
    text: 솔직히 말해서, 나도 머릿속이 하얗게 비어버렸단다.
  - register: —
    text: 당장 네가 3번째 배지를 얻을 수 없게 된 것도 문제지만...
  - register: 하대
    text: 그래도 내가 부탁한 대로 잘해 줬구나. 수고했어.
  - register: —
    text: 도시의 섭정인 <b>사핀</b> 님이 지난주에... 공방 화재로 세상을 떠나셨거든.
  source: translate/voice-prompts.jsonl
- group: 미라
  match:
    name: 미라
  instruction: 딱딱한 문어체 하대 「~다/~하라」. 대놓고 높은 인물(국왕·스승 아우레)을 뺀 대부분에게 하대한다. 격식 있는 호칭을 쓰면서도 종결은 낮추는 것이 이 인물의 설계다. 크리산토·히비스에게 쓰는 vos는 단수 경칭이니 그 자리만 하오체로. 일행을 부르는 vosotros는 복수이지 경칭이 아니다. 주어 존대(「스승께서는 ~하셨다」)는 유지하되 종결은 낮춘다. 웃음기 없음. [맵<119] 크리산토를 부르는 말 없이 낮춘다. [맵>=119] 크리산토를 「<i>무슈</i> 크리산토」로 부른다. [맵>=150] 크리산토를 「크리산토 선생」으로 부른다.
  samples:
  - register: 하대
    text: 그자들을 사냥하고 있지. 너희도 이미 마주친 적이 있겠지?
  - register: —
    text: 참으로... 참으로 감동적이구나!
  - register: 하대
    text: 우리의 길이 다시 교차하는구나. 네 이름이…?
  - register: 하대
    text: 용서하라. 벅차오르는 눈물을 주체할 수 없군.
  - register: 하대
    text: 이 트리미앙만 해도 무언가를 주입당했다. 그래서 기묘한 빛을 내뿜는 것이다.
  - register: 하대
    text: 앱솔, 무얼 해야 할지 알겠지.
  - register: 하대
    text: 보기 좋은 광경은 아닐 테니.
  - register: 하대
    text: 그럼 이만, 트레이너들이여.
  source: translate/voice-prompts.jsonl
- group: 아스테르 제피르
  match:
    name: 아스테르 제피르
  instruction: 품위 있는 「~다/~하네」. 신하에게도 정중, 주인공을 신뢰로 대함
  samples:
  - register: 하대
    text: 하지만 이 불행의 고리를 끊어내기엔 아직 늦지 않았어.
  - register: 하대
    text: 뭐라고? 무슨 소리를 하는 게냐, 불길한 포켓몬이여?
  - register: 하대
    text: 언젠가, 우리 다시 만날 수 있으리라 믿네.
  - register: 하대
    text: 나의 충직한 포켓몬인 검은 꽃의 플라베베가 이제 너와 함께할 게다.
  - register: 하대
    text: 서로를 잘 보살피겠다고 약속해주려무나.
  - register: 하대
    text: 그렇게, 국왕은 홀로 남게 되었다...
  - register: 하대
    text: 큰 효과가 있을 거라 기대했네. 결국 내가 직접 설계한 무기들이니 말이야.
  - register: 하대
    text: 먼저 다친 포켓몬들을 찾아 구호하는 것이 좋겠네. 그들이야말로 가장 무고한 이들이니.
  source: translate/voice-prompts.jsonl
- group: 메를로
  match:
    name: 메를로
  instruction: 군인 문어체. **존대는 왕에게만** — 그 밖에는 「~느냐/~다」로 낮춘다. C'est impossible 류 유지
  samples:
  - register: 하대
    text: 혹시 우리를 파멸시키고자 적들과 내통하고 있는 것이냐?
  - register: 존대
    text: 그 새로운 포병 무기들이 적을 상대로 결정적인 차이를 만들어 냈습니다.
  - register: —
    text: 주민들을 통제해라! 지나치게 소란을 피우지 못하게 해라!
  - register: 하대
    text: 마차가 접근하도록 두어라. 악의 뿌리를 통째로 뽑아 주마!
  - register: 존대
    text: 그렇기에 명예로운 길에서 벗어나지 않기를 간언합니다. 부상자들을 치료해야 합니다!
  - register: —
    text: 뭐라? 이 마을 주민들이 무고하다고?
  - register: 하대
    text: 허가받지 않은 차량의 통행을 금지했을 텐데!
  - register: 하대
    text: 그렇군! 그런 사정이 있었단 말이지!
  source: translate/voice-prompts.jsonl
- group: 히소포
  match:
    name: 히소포
  instruction: 연극적 과장, 자기도취. **무대·사교장에서는 존대, 극장 안 배우 앞에서는 반말.**
  samples:
  - register: 하대
    text: 무대에 오르면 다른 배우와 치열한 포켓몬 배틀을 벌여야 해.
  - register: 존대
    text: 감사합니다. 감사합니다! 참으로 최고의 관객 여러분이십니다!
  - register: —
    text: 그리고 그 나무가 지닌 힘은 결코 우연이 아니었으니, 그 안에는...
  - register: 하대
    text: 그리고 진정한 포켓몬 배틀이야말로 사람의 본모습을 밝혀내는 법이지!
  - register: 존대
    text: 저와 함께해 준 모든 배우와 예술가 여러분께 감사의 말씀을 전합니다.
  - register: —
    text: 나무 밑동을 지키며 생명을 부여하는 포켓몬, <b>제르네아스</b>.
  - register: 하대
    text: 나를 기다리게 할 작정인가? 진심으로? 그만한 가치가 있기를 바라지.
  - register: 존대
    text: 하지만 이것만은 절대 잊지 마십시오.
  source: translate/voice-prompts.jsonl
- group: 아조스단 신병
  match:
    name: 아조스단 신병
  instruction: 선동조 존대(연설)와 조무래기 반말(전투) 두 벌
  samples:
  - register: 하대
    text: 녀석의 포켓몬이 지친 지금이야말로 결정타를 날릴 때다.
  - register: 존대
    text: 그런 말씀 마십시오, 어르신! 삶은 소중한 선물입니다!
  - register: —
    text: 그리고 이건 시작에 불과합니다, 친애하는 시민 여러분!
  - register: 하대
    text: 드디어 앙갚음할 때가 왔군. 매운맛을 보여줄 테니 각오해라!
  - register: 존대
    text: 아름답고 영원무궁한 모든 것의 인도자가 될 분을 기억하십시오!
  - register: —
    text: 여러분이 흘리는 눈물의 골짜기에 전하는 해답!
  - register: 하대
    text: 방심할 수 없는 눈잇가시로군...
  - register: 존대
    text: 여러분 중 혹시 병에 걸리거나 부상을 입었거나 몸이 불편하신 분 계십니까?
  source: translate/voice-prompts.jsonl
- group: 카놀라
  match:
    name: 카놀라
  instruction: 근엄한 평서 「~다」, 예를 갖춘 하대
  samples:
  - register: 하대
    text: 그리고 포켓몬 트레이너에게 여정이란 언제나 목적지보다 중요한 법이다.
  - register: —
    text: 삶은 언제나 죽음을 극복하고, 강함은 약함을 넘어서는 법.
  - register: 하대
    text: 나에게 보여준 그 뛰어난 용맹에 대한 포상으로 이 기술머신도 가져가거라.
  - register: —
    text: 그럼, 승부를 시작해보겠나?
  - register: 하대
    text: 아직 준비가 덜 되었다면 서두르거라. 나중에 따로 처리해야 할 업무가 있으니.
  - register: 하대
    text: 내가 온 힘을 다해 엄격히 상대했음에도, 그대는 포켓몬을 믿고 강하게 훌륭히 이겨냈구나.
  source: translate/voice-prompts.jsonl
- group: 알카
  match:
    name: 알카
  instruction: 위엄 있는 하대 「~다/~하마/~이냐」. 철학적 장광설, 서두르지 않음. 프랑스어 구절(s'il vous plait) 유지
  samples:
  - register: 하대
    text: 스스로의 모습을 알아보기 힘든 모양이구나, 안 그러냐?
  - register: —
    text: 위업, 성취... 어쩌면 <b>포켓몬리그</b>에서 우승까지 거머쥐었을지도 모르지.
  - register: 하대
    text: 하지만 이제 넌 늙어 버렸다. 네 눈은 잿빛으로 얼룩져 있구나.
  - register: 하대
    text: 얼마나 많은 삶을 빼앗겼단 말이냐!
  - register: 하대
    text: 두 번 경고하진 않는다. 알겠느냐?
  - register: 하대
    text: 어떤 영주도, 어떤 왕도 살아남지 못할 것이다!
  source: translate/voice-prompts.jsonl
- group: 란토
  match:
    name: 란토
  instruction: '**이중 말투가 정체성** — 사교장에선 능글맞은 해요체·경칭 남발, 본색은 표독한 반말("네 목을 베어버릴 테니까"). 장면 맥락 따라 갈라 쓸 것'
  samples:
  - register: 존대
    text: <i>마드모아젤</i> <b>올리비에</b>, 삼가 고인의 명복을 빕니다.
  - register: 존대
    text: 저는 이만 비루한 보금자리로 돌아가봐야겠습니다만, 부디...
  - register: 존대
    text: 내 정중한 호의를 왜 곡해하시나요?
  - register: 존대
    text: 후, 후, 후! 내가 파티에서 가장 즐거운 곳들을 안내해 줄 수도 있답니다.
  - register: 존대
    text: 대장님의 기대를... 충족시켜 드리지 못해 죄송합니다.
  source: translate/voice-prompts.jsonl
- group: 프리물라
  match:
    name: 프리물라
  instruction: 과하게 밝은 해요체·스포츠맨십 문구("중요한 건 참여"). 후반 영원 집착이 배어나게 — 톤은 유지한 채 내용만 섬뜩하게
  samples:
  - register: 하대
    text: 모두가 협력하면 그 어느 때보다 아름답고 덕망 높은 사회를 만들 수 있을 거야, 두고 봐!
  - register: 존대
    text: 그곳에서 새로운 왕조를 세워 언젠가 권력을 잡겠다고 하셨습니다.
  - register: 존대
    text: 정말 멋진 분이지 않습니까?
  source: translate/voice-prompts.jsonl
- group: F3
  match:
    name: F3
  instruction: 기계적 합쇼체, 수치를 인용하듯 말한다. 후반부는 같은 격식에 감정이 배어나게.
  samples:
  - register: 존대
    text: 갇혀 있었던 것은 사실입니다. 하지만 혼자는 아니었습니다.
  - register: 존대
    text: 그렇습니까? 사과드립니다. 저는 아직 인간의 복잡한 감정 범주를 배워가는 중입니다.
  - register: 존대
    text: 이곳의 포켓몬들이 좋은 친구가 되어 주었습니다.
  - register: 존대
    text: 허락해 주신다면, 제가 직접 학원장님께 서류를 전달하러 가겠습니다.
  source: translate/voice-prompts.jsonl
- group: 로시욘
  match:
