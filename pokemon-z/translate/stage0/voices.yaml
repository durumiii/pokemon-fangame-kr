- group: 로토
  match:
    name: 로토
  instruction: 기본 하대. **윗사람 앞에서만 존대**(맵149의 존대는 클라벨리나 섭정에게 향한다). 해적은 로토의 부하이므로 하대다 — 옛 지시 「해적을 상대할 때는 존대」는 2026-08-16에 뒤집혔다. **성배를 마시고 죽음의 전령이 된 뒤에도 격은 반말 그대로다** — 고어 하대(「~느니라」·「보거라」·「그대여」)나 하게체(「~다네」·「자네」)로 갈아입지 않고, 위엄은 어휘로 낸다(어둠의 마법·저승길·죽음의 전령). 애칭(내 사랑·mon chéri)과 웃음(히, 히 / 후, 후, 후)은 원문대로 끝까지 유지한다.
  samples:
  - register: 하대(변신 뒤)
    text: 아직 아무것도 못 봤어! 내가 무엇을 할 수 있는지, 내 어둠의 마법이 어디까지 뻗는지 똑똑히 봐 둬!
  - register: 하대(변신 뒤)
    text: 그날이 오면, 내 사랑, 기꺼이 내가 저승길의 동무가 되어 주지!
  source: translate/voice-prompts.jsonl
- group: 뱃사공
  match:
    name: 뱃사공
  instruction: '**옛 장사치 합쇼체.** 기본 종결은 「-습니다/-습니까」, 권유·제안은 「-시렵니까」, 능청·생색 자리는 준꼴 「-습죠/-ㅂ죠」. 색을 넣는 자리에 한해 「모실깝쇼」·「앉으십쇼」 — 왕정 시대 사공의 굽실 말투로 독자가 이미 아는 형태만 쓴다. 평범한 해요체로 펴지 마라.'
  samples: []
  source: translate/voice-prompts.jsonl
- group: 아우레
  match:
    name: 아우레
  instruction: 태고의 존재라 말투가 높고 느리다. 상대에 따라 격이 갈린다 — 말보 왕에게는 원문이 vos 계열(vos·vuestro·habéis·sois)이라 「그대」에 하게체(~네·~인가·~게야·~군), 존댓말도 반말도 아니다. 드루이드 무리처럼 여럿을 상대할 때는 vosotros라 전설 포켓몬의 사자로서 존대로 말하되 2인칭은 「그대들」이다 — 존대 어미에 「너희」를 섞지 않는다. 미라·크리산토에게는 tú이므로 반말. 사람을 낮춰 보는 내용을 높은 격조로 말하는 데서 서늘함이 나온다.
  samples:
  - register: 옛 경칭(말보 왕에게)
    text: 하지만 그대는 자격이 없네. 거대한 역사의 흐름 속에서 그대의 치세는 그저 약간의 소음을 일으킨 것으로 기억될 뿐이지.
  - register: 옛 경칭(말보 왕에게)
    text: 그대의 연금술사들은 내가 글로 적어 남긴 설계도를 아직도 해석하려 애쓰고 있는가?
  - register: 하대(그 밖)
    text: 인간이란 지배하기 위해서만 무언가를 보살피는 법이니까.
  - register: 존대(여럿에게)
    text: 전하들께서는 그대들 문명이 보여준 결실에 만족하고 계십니다.
  source: translate/voice-prompts.jsonl
