    gitana/gitano: 집시 점술사 — 성직(신비) 결로 묶었으나 공연 결일 수도
    luigi: 이스터에그 인물로 추정(대사 3행) — voices에 두되 원문 유지 대상일 수 있음
    automata: 로봇 어투 특수 처리 후보(합쇼체 기계식) — 공연에 묶어 두되 개별 판정
    cristalArbol/alma: 스프라이트는 오브젝트지만 실제로는 인물 발화(숨은 사람·유령 서사) — 표본 실측으로 사물지문에서 제외, 행 단위 재검 후보
    druidaFicus: 말투표 「대드루이드 피쿠스(경건한 합쇼체)」 실존 — voices로 이동(페르소나표 지적 반영, 2026-08-03)
  buckets:
    _comment: 그룹 → 어투 버킷 배정안(B1~B5는 docs/research/2026-08-03-npc-register-study.md). 물음표는 사용자 판단 대기.
    voices: 말투표(voices.md) 라우팅 — 버킷 밖
    서민: B1
