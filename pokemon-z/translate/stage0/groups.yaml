  unsure:
    azoth*: 팀 아조스 조무래기가 기본이나 간부 개인(안드레아 등) 장면도 섞임 — 행 단위 재검 필요
    mari: 이름 매칭(마리) vs 슈퍼 트레이닝 안내원 — 표본상 접객으로 두되 재검
    gitana/gitano: 집시 점술사 — 성직(신비) 결로 묶었으나 공연 결일 수도
    luigi: 이스터에그 인물로 추정(대사 3행) — voices에 두되 원문 유지 대상일 수 있음
    automata: 로봇 어투 특수 처리 후보(합쇼체 기계식) — 공연에 묶어 두되 개별 판정
    cristalArbol/alma: 스프라이트는 오브젝트지만 실제로는 인물 발화(숨은 사람·유령 서사) — 표본 실측으로 사물지문에서 제외, 행 단위 재검 후보
    druidaFicus: 말투표 「대드루이드 피쿠스(경건한 합쇼체)」 실존 — voices로 이동(페르소나표 지적 반영, 2026-08-03)
  buckets:
    _comment: 그룹 → 어투 버킷 배정안(B1~B5는 docs/research/2026-08-03-npc-register-study.md). 물음표는 사용자 판단 대기.
    voices: 말투표(voices.md) 라우팅 — 버킷 밖
    서민: B1
    귀족: 'B2(정중 해요+오만 어휘) — 단 원시 스프라이트로 쪼갬: burguesow=신사/burguesaow=귀부인/burguesaow2=아가씨 (그림 실측 2026-08-03). 개성은 페르소나표가 정본'
    군인: B1(거친 결) + 통보문만 B3
    성직: '3분할 수정: monjeYantra=겸손 합쇼(그림 학승+표본 4/6 실측 — 「무투승 다체」 방침은 해당 스프라이트 없음)/druida·노승=B4 장중/일반 수사·수녀=경건 합쇼'
    학자: B1 (격식 박사 개별 B2)
    접객: B2 + 절차 문장 B3
    공연: B2/B3 (쇼맨십 과장)
    어린이: B1 (어른 상대 해요 허용)
    노인: B4
    일반: B1 — 기본값 반말 전환 확정(사용자 2026-08-03)
    적대: B1(거친 결)
    사물지문: B5
    포켓몬특수: B5 기본, 발화형은 개별
